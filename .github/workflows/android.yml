name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Manga Fire APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
            # استخراج المفتاح السري مع تجاهل أي فواصل أسطر أو مسافات مخفية
      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode --ignore-garbage > keystore.jks

      # 2. توقيع التطبيق باستخدام أدوات أندرويد الرسمية المدمجة في السيرفر
      - name: Sign APK Native
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          # تحديد مسار أحدث أدوات بناء متوفرة في السيرفر
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          # العثور على ملف الـ APK الناتج من خطوة البناء
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          
          # محاذاة الملف (Zipalign) ليتوافق مع متجر جوجل
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_PATH" app-aligned.apk
          
          # التوقيع النهائي (Apksigner)
          $BUILD_TOOLS/apksigner sign --ks keystore.jks --ks-pass env:KEY_STORE_PASSWORD --ks-key-alias "$ALIAS" --key-pass env:KEY_PASSWORD --out app-release-signed.apk app-aligned.apk

      # 3. رفع التطبيق الموقع كملف جاهز للتحميل
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaFire-v1.0-Release-Signed
          path: app-release-signed.apk
