name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Manga Fire APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper and Permissions
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Restoring google-services.json..."
            if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "876524751666",
    "firebase_url": "https://anime-glover-default-rtdb.firebaseio.com",
    "project_id": "anime-glover",
    "storage_bucket": "anime-glover.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:876524751666:android:da12e159815b9125b6e52b",
        "android_client_info": {
          "package_name": "com.fire.mangareader"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyAoqemz_egd-MhExdN6dmgmW_Ni-hn1O38"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            fi
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      # 1. استخراج المفتاح السري من جيثب وتحويله لملف
      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks

      # 2. توقيع التطبيق باستخدام أدوات أندرويد الرسمية المدمجة في السيرفر
      - name: Sign APK Native
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          # تحديد مسار أحدث أدوات بناء متوفرة في السيرفر
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          # العثور على ملف الـ APK الناتج من خطوة البناء
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          
          # محاذاة الملف (Zipalign) ليتوافق مع متجر جوجل
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_PATH" app-aligned.apk
          
          # التوقيع النهائي (Apksigner)
          $BUILD_TOOLS/apksigner sign --ks keystore.jks --ks-pass env:KEY_STORE_PASSWORD --ks-key-alias "$ALIAS" --key-pass env:KEY_PASSWORD --out app-release-signed.apk app-aligned.apk

      # 3. رفع التطبيق الموقع كملف جاهز للتحميل
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaFire-v1.0-Release-Signed
          path: app-release-signed.apk
